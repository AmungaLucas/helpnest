// Copyright (c) Infinite Red, Inc. - https://github.com/infinitered/react-native-mlkit
// Vendored 2026-10: the npm wrapper transitively installs expo-image@58 (an SDK-58
// package) whose expo-module.config.json publication block lacks "version", which
// crashes Expo SDK 57 Gradle autolinking ("Field 'version' is required for type
// ... Publication"). The wrapper JS layer is bypassed by
// src/services/documentScannerService.js (direct native-module probe), so only
// these native sources are needed. Publishing config removed (local module);
// play-services-mlkit-document-scanner bumped from 16.0.0-beta1 to stable 16.0.0.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

buildscript {
  def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
  if (expoModulesCorePlugin.exists()) {
    apply from: expoModulesCorePlugin
    applyKotlinExpoModulesCorePlugin()
  }

  // Simple helper that allows the root project to override versions declared by this library.
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }

  // Ensures backward compatibility
  ext.getKotlinVersion = {
    if (ext.has("kotlinVersion")) {
      ext.kotlinVersion()
    } else {
      ext.safeExtGet("kotlinVersion", "1.8.10")
    }
  }

  repositories {
    mavenCentral()
  }

  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${getKotlinVersion()}")
  }
}

android {
  compileSdkVersion safeExtGet("compileSdkVersion", 34)

  def agpVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION
  if (agpVersion.tokenize('.')[0].toInteger() < 8) {
    compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
      jvmTarget = JavaVersion.VERSION_17.majorVersion
    }
  }

  namespace "red.infinite.reactnativemlkit.documentscanner"
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 21)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${getKotlinVersion()}"

  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.3"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.3"
}
